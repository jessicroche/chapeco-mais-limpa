<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Chapecó Mais Limpa: encontre orientações sobre descarte correto de resíduos, ecopontos e ações ambientais em Chapecó.">

    <meta name="theme-color" content="#1b4332">

    <title>Chapecó+Limpa</title>
    <link rel="icon" type="image/png" href="../img/logo_sem_nome.png">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="home-institucional">
    <header class="topo-institucional">
        <a href="../index.html" class="logo-area" aria-label="Chapecó Mais Limpa - Início">
            <img src="../img/logo_nome.png" alt="Chapecó Mais Limpa">
        </a>
        <nav class="menu-navegacao" aria-label="Navegação principal">
            <a href="../index.html" class="ativo" aria-current="page">
                Início </a>
            <a href="onde-descartar.html">
                Como descartar </a>
            <a href="projetos-prefeitura.html">
                Ecopontos</a>
            <a href="acoes.html">
                Ações e eventos
            </a>
            <a href="projeto.html">
                O projeto
            </a>

        </nav>

        <div class="acoes-topo">
            <div class="btn-fonte-grupo" title="Ajustar tamanho do texto">
                <button
                    id="btn-diminuir-fonte"
                    class="btn-fonte"
                    type="button"
                    aria-label="Diminuir tamanho do texto">
                    A-
                </button>
                <button
                    id="btn-aumentar-fonte"
                    class="btn-fonte"
                    type="button"
                    aria-label="Aumentar tamanho do texto">
                    A+
                </button>
            </div>
            <button
                id="theme-toggle"
                class="btn-theme"
                type="button"
                aria-label="Alternar tema">
                🌓 Tema
            </button>

        </div>
    </header>


    <main class="container-home">
        <section class="hero-section">
            <h1>Login</h1>
            <hr>
            <div style="margin-top: 16px;">
                <p>
                    <strong>E-mail:</strong>
                </p>
                <input
                    type="email"
                    id="email"
                    placeholder="Ex: jessica@gmail.com">
            </div>

            <div style="margin-top: 16px;">
                <p>
                    <strong>Senha:</strong>
                </p>
                <input
                    type="password"
                    id="senha"
                    placeholder="*************">
            </div>


            <button
                id="btn-login"
                class="btn-principal"
                type="button"
                style="margin-top: 12px;">
                Entrar
            </button>

            <p id="mensagem-login"></p>

        </section>

    </main>

    <footer class="rodape-home">

        <div class="rodape-conteudo">

            <span>🌿</span>

            <p>&copy; 2026 - criado por Jéssica Brito</p>

        </div>

    </footer>


    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/login.js"></script>

</body>

</html>
